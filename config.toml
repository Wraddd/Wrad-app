# Thème calqué sur wrad.fr : fond #09090B, cartes #141417, rouge #FF002E,
# titres en Montserrat, texte en Inter.
[theme]
base = "dark"
primaryColor = "#FF002E"
backgroundColor = "#09090B"
secondaryBackgroundColor = "#18181B"
textColor = "#F4F4F5"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "Montserrat:https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&display=swap"
baseRadius = "12px"
buttonRadius = "12px"
borderColor = "#27272A"
showWidgetBorder = true
linkColor = "#FF002E"

[theme.sidebar]
backgroundColor = "#0D0D10"
secondaryBackgroundColor = "#18181B"
borderColor = "#27272A"

[client]
toolbarMode = "minimal"

[runner]
magicEnabled = false
